package: cloud.lazycat.app.ziwei-chart
version: 0.2.0-3
name: 紫微知道 Ziwei Chart
description: 自托管的紫微斗数排盘工具：真太阳时排盘、十二宫命盘与人生 K 线；可选 AI 运势与合盘分析，出生信息仅在你的浏览器中处理。
author: Ziwei Knows
license: GPL-3.0
homepage: https://github.com/ziweiknows/ziwei-chart
min_os_version: 1.5.0
locales:
  zh-CN:
    name: 紫微知道
    description: 自托管的紫微斗数排盘工具：真太阳时排盘、十二宫命盘与人生 K 线；可选 AI 运势与合盘分析，出生信息仅在你的浏览器中处理。
    usage: |
      紫微知道（Ziwei Chart）是一个自托管的紫微斗数排盘工具：输入出生信息即可生成十二宫命盘，
      查看人生 K 线，并在配置 AI 模型后获得年度运势与双人合盘分析；还可导出分享卡片。
      排盘计算全部在浏览器本地完成，无需注册账号，出生信息不会上传到任何服务器。

      首次使用：
      1. 打开应用即为中文界面，无需登录。
      2. 在首页填写出生日期、时间、性别与出生地（出生地用于真太阳时校正，已内置城市数据），
         点「开始排盘」生成命盘。

      核心操作：
      - 命盘解读：查看十二宫、主星、四化与格局分析，点击星曜可查看释义。
      - 人生 K 线：以 K 线形态回看人生节奏，默认使用本地算法生成，无需任何配置。
      - 年度运势（AI 功能）：切换到流年查看运势分析，需要先在「设置」中配置 API Key。
      - 双人合盘（AI 功能）：输入另一人的出生信息生成合盘分析，同样需要配置 API Key。
      - 分享卡片：自定义金句等选项后，点「保存分享图」，会弹出统一文件窗口，
        可选择保存到懒猫网盘或本地。

      AI 配置（可选）：
      在「设置」中填写自己的大模型 API Key（支持 Kimi、Gemini、Claude、DeepSeek 及任意
      OpenAI 兼容接口）。不配置不影响排盘与人生 K 线；AI 功能由浏览器直接访问所填服务商接口，
      费用与可用性取决于所选服务商。

      数据说明：
      - 排盘数据仅在当前浏览器页面内使用，刷新页面后需要重新排盘；应用不在微服上保存任何
        出生信息或命盘数据。
      - 应用设置（包括你填写的 API Key）保存在当前浏览器的本地存储中。
      - 重启与升级不会影响应用，升级不改变访问地址。

      其他：
      - 本应用按上游 GPL-3.0 许可分发，随包附完整许可证文本；对应源码：
        https://github.com/ziweiknows/ziwei-chart
      - 内置城市经度数据按木兰宽松许可证第 2 版分发（随包附许可声明）。
  en-US:
    name: Ziwei Chart
    description: "Self-hosted Zi Wei Dou Shu (Purple Star Astrology) charting: true-solar-time 12-palace chart and life K-line, plus optional AI fortune and compatibility analysis; birth data is processed in your browser only."
    usage: |
      Ziwei Chart is a self-hosted Zi Wei Dou Shu (Purple Star Astrology) tool:
      enter birth information to generate a 12-palace chart, view the life K-line,
      and (after configuring an AI model) get yearly fortune and two-person
      compatibility analysis, plus an exportable share card. All chart
      calculations run in your browser; no account is required and birth
      information is never uploaded to any server.

      Getting started:
      1. The app opens in Chinese; no login needed.
      2. Fill in birth date, time, gender and birthplace (used for true-solar-time
         correction; city data is bundled), then click "开始排盘" (Generate chart).

      Core features:
      - Chart reading: 12 palaces, major stars, four transformations and patterns;
        click a star to see its explanation.
      - Life K-line: review life rhythm as a candlestick chart; generated by a
        local algorithm with no configuration needed.
      - Yearly fortune (AI): switch the year to view its analysis; requires an
        API key configured in Settings.
      - Compatibility (AI): enter a second person's birth information; also
        requires a configured API key.
      - Share card: after customizing options such as the quote line, click the
        "保存分享图" (save share image) button; a unified file dialog lets you
        save to the LazyCat cloud drive or locally.

      AI configuration (optional):
      Set your own LLM API key in Settings (Kimi / Gemini / Claude / DeepSeek or
      any OpenAI-compatible endpoint). Core charting and the life K-line work
      without it. AI features call the provider you configure directly from the
      browser; cost and availability depend on that provider.

      Data notes:
      - Chart data lives in the current browser page only; a page refresh asks
        you to re-generate the chart. No birth information or chart data is
        stored on the microserver.
      - App settings (including your API key) are stored in this browser's local
        storage.
      - Restarts and upgrades do not affect the app, and its URL stays unchanged.

      License:
      - Distributed under the upstream GPL-3.0 license (full text bundled);
        source: https://github.com/ziweiknows/ziwei-chart
      - Bundled city longitude data is licensed under Mulan PSL v2
        (license notice bundled).
